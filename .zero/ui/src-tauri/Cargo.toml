[package]
name = "zero-os"
version = "0.6.0"
description = "Zero OS — Neural AI Desktop"
authors = ["Cyph"]
edition = "2021"

[[bin]]
name = "zero-os"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
