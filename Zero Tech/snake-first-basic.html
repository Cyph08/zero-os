<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake · Classic</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #0b1720 0%, #1a2f3a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 1rem;
    }

    .game-card {
      background: #1e3a47;
      border-radius: 2rem;
      padding: 1.5rem 1.5rem 2rem;
      box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.7), inset 0 1px 3px rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    .top-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 0.25rem;
    }

    .score-badge {
      background: #0f212b;
      padding: 0.5rem 1.4rem;
      border-radius: 3rem;
      font-weight: 600;
      font-size: 1.2rem;
      color: #b9e6f0;
      letter-spacing: 0.5px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.6), 0 4px 8px rgba(0, 0, 0, 0.3);
      border: 1px solid #2c5565;
    }

    .score-badge span {
      color: #7ef0d0;
      font-weight: 700;
    }

    button {
      background: #2c5565;
      border: none;
      color: #e4f5fc;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.6rem 1.6rem;
      border-radius: 3rem;
      cursor: pointer;
      box-shadow: 0 6px 0 #0f1f27, 0 8px 14px rgba(0, 0, 0, 0.4);
      transition: all 0.08s ease;
      letter-spacing: 0.3px;
      border: 1px solid #4f8297;
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0f1f27, 0 6px 12px rgba(0, 0, 0, 0.4);
    }

    canvas {
      display: block;
      width: 400px;
      height: 400px;
      border-radius: 1.5rem;
      box-shadow: 0 0 0 2px #1f4453, 0 0 0 5px #0f1f27, 0 20px 30px -8px black;
      background: #0e1c24;
      max-width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
    }

    .hint {
      color: #7c9fae;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      font-weight: 500;
      display: flex;
      gap: 1.8rem;
      margin-top: -0.2rem;
    }

    .hint kbd {
      background: #112b34;
      padding: 0.2rem 0.7rem;
      border-radius: 2rem;
      color: #b9dce8;
      font-weight: 600;
      font-size: 0.8rem;
      border: 1px solid #2d5f70;
      box-shadow: inset 0 1px 3px black;
    }

    @media (max-width: 500px) {
      .game-card {
        padding: 1rem;
      }
      canvas {
        width: 300px;
        height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="game-card">
    <div class="top-panel">
      <div class="score-badge">🍎 <span id="scoreDisplay">0</span></div>
      <button id="restartButton">⟳ New Game</button>
    </div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="hint">
      <span><kbd>← ↑ → ↓</kbd> or <kbd>W A S D</kbd></span>
    </div>
  </div>

  <script>
    (function() {
      // ---------- CONFIG ----------
      const GRID_SIZE = 20;           // 20x20 cells
      const CELL_SIZE = 20;           // 400px / 20 = 20px per cell
      const TICK_INTERVAL_MS = 120;   // speed (ms per move)

      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreSpan = document.getElementById('scoreDisplay');
      const restartBtn = document.getElementById('restartButton');

      // Feature detect roundRect so we don't clobber a native implementation
      const hasNativeRoundRect = typeof CanvasRenderingContext2D !== 'undefined' &&
        typeof CanvasRenderingContext2D.prototype.roundRect === 'function';

      // ---------- GAME STATE ----------
      let snake = [];                 // array of {x, y}
      let direction = { x: 1, y: 0 }; // current movement direction
      let nextDirection = { x: 1, y: 0 };
      let food = { x: 6, y: 10 };
      let score = 0;
      let gameOver = false;
      let winFlag = false;

      // timer / loop control
      let gameInterval = null;

      // ---------- HELPER: generate random food not on snake ----------
      function generateRandomFood() {
        const maxAttempts = 2000;
        for (let attempt = 0; attempt < maxAttempts; attempt++) {
          const randX = Math.floor(Math.random() * GRID_SIZE);
          const randY = Math.floor(Math.random() * GRID_SIZE);
          if (!snake.some(segment => segment.x === randX && segment.y === randY)) {
            return { x: randX, y: randY };
          }
        }
        // Fallback: scan all cells (rare)
        for (let y = 0; y < GRID_SIZE; y++) {
          for (let x = 0; x < GRID_SIZE; x++) {
            if (!snake.some(segment => segment.x === x && segment.y === y)) {
              return { x, y };
            }
          }
        }
        return null; // board full -> win condition handled elsewhere
      }

      // ---------- RESET / INIT GAME ----------
      function resetGame() {
        // clear any running interval
        if (gameInterval) {
          clearInterval(gameInterval);
          gameInterval = null;
        }

        // initial snake: 3 segments, placed horizontally around centre
        snake = [
          { x: 9, y: 10 },  // head
          { x: 8, y: 10 },
          { x: 7, y: 10 }
        ];

        // initial direction: moving right
        direction = { x: 1, y: 0 };
        nextDirection = { x: 1, y: 0 };

        // reset score & flags
        score = 0;
        gameOver = false;
        winFlag = false;
        scoreSpan.textContent = '0';

        // place food somewhere free
        const newFood = generateRandomFood();
        if (newFood) {
          food = newFood;
        } else {
          // extremely unlikely at start, but just in case:
          food = { x: 5, y: 5 };
        }

        // draw the fresh board
        drawBoard();

        // start the game loop (if not already running)
        startLoop();
      }

      // ---------- START INTERVAL LOOP ----------
      function startLoop() {
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(() => {
          if (!gameOver) {
            gameTick();
          }
        }, TICK_INTERVAL_MS);
      }

      // ---------- GAME TICK (move snake) ----------
      function gameTick() {
        if (gameOver) return;

        // Commit the queued direction (prevent 180° reversal)
        if (
          (nextDirection.x !== 0 || nextDirection.y !== 0) &&
          (direction.x !== -nextDirection.x || direction.y !== -nextDirection.y)
        ) {
          direction = { x: nextDirection.x, y: nextDirection.y };
        }

        // Calculate new head position
        const head = snake[0];
        const newHead = {
          x: head.x + direction.x,
          y: head.y + direction.y
        };

        // Check wall collision
        if (
          newHead.x < 0 || newHead.x >= GRID_SIZE ||
          newHead.y < 0 || newHead.y >= GRID_SIZE
        ) {
          gameOver = true;
          drawBoard();
          return;
        }

        // Check if food is eaten
        const foodEaten = (newHead.x === food.x && newHead.y === food.y);

        // Prepare new snake array
        let newSnake = [newHead, ...snake];

        if (foodEaten) {
          // Keep the tail (snake grows)
          score++;
          scoreSpan.textContent = score;

          // Generate new food; if null, board is full -> win
          const newFood = generateRandomFood();
          if (newFood) {
            food = newFood;
          } else {
            // WIN condition: snake fills entire board
            winFlag = true;
            gameOver = true;
            // Snake is already full length; keep as is
            snake = newSnake;
            drawBoard();
            return;
          }
        } else {
          // Remove tail (normal move)
          newSnake.pop();
        }

        // Check self-collision (new head collides with any body segment)
        // Head is at newSnake[0], rest are 1..end
        const headCollision = newSnake.slice(1).some(
          segment => segment.x === newHead.x && segment.y === newHead.y
        );
        if (headCollision) {
          gameOver = true;
          // do not update snake further, keep newSnake? better to keep old snake for drawing
          // just show board with old snake, but new head position is invalid
          drawBoard();  // draw old snake (no update)
          return;
        }

        // Commit the new snake
        snake = newSnake;

        // Redraw the canvas
        drawBoard();
      }

      // ---------- DRAW EVERYTHING ----------
      function drawBoard() {
        // Clear background
        ctx.fillStyle = '#0e1c24';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // subtle grid lines
        ctx.strokeStyle = '#1a3240';
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= GRID_SIZE; i++) {
          ctx.beginPath();
          ctx.moveTo(i * CELL_SIZE, 0);
          ctx.lineTo(i * CELL_SIZE, canvas.height);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, i * CELL_SIZE);
          ctx.lineTo(canvas.width, i * CELL_SIZE);
          ctx.stroke();
        }

        // Draw snake
        snake.forEach((segment, index) => {
          const isHead = (index === 0);
          const x = segment.x * CELL_SIZE;
          const y = segment.y * CELL_SIZE;

          // Rounded segments
          ctx.shadowColor = isHead ? '#9bffcf' : '#2f9e7a';
          ctx.shadowBlur = isHead ? 12 : 6;
          ctx.fillStyle = isHead ? '#7ef0d0' : '#3dba8c';

          // Rounded rectangle
          const radius = 4;
          ctx.beginPath();
          ctx.roundRect(x + 1.5, y + 1.5, CELL_SIZE - 3, CELL_SIZE - 3, radius);
          ctx.fill();
        });

        // Draw food
        if (food && !winFlag) {
          const fx = food.x * CELL_SIZE;
          const fy = food.y * CELL_SIZE;
          ctx.shadowColor = '#ff6b6b';
          ctx.shadowBlur = 15;
          ctx.fillStyle = '#ff5e5e';
          ctx.beginPath();
          ctx.arc(fx + CELL_SIZE / 2, fy + CELL_SIZE / 2, CELL_SIZE / 2 - 2, 0, Math.PI * 2);
          ctx.fill();

          // tiny shine
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#ffb3b3';
          ctx.beginPath();
          ctx.arc(fx + CELL_SIZE / 2 - 2, fy + CELL_SIZE / 2 - 2, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }

        // Reset shadow
        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';

        // Draw game over / win overlay
        if (gameOver) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.font = 'bold 28px "Segoe UI", system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = winFlag ? '#b9ffb9' : '#ffb0b0';
          const message = winFlag ? '🏆 YOU WIN!' : '💀 GAME OVER';
          ctx.fillText(message, canvas.width / 2, canvas.height / 2 - 15);

          ctx.font = '16px "Segoe UI", system-ui, sans-serif';
          ctx.fillStyle = '#cfe6f0';
          ctx.fillText('press "New Game"', canvas.width / 2, canvas.height / 2 + 30);
        }
      }

      // polyfill for rounded rect only if the browser lacks it
      if (!hasNativeRoundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
          if (w < 2 * r) r = w / 2;
          if (h < 2 * r) r = h / 2;
          this.moveTo(x + r, y);
          this.lineTo(x + w - r, y);
          this.quadraticCurveTo(x + w, y, x + w, y + r);
          this.lineTo(x + w, y + h - r);
          this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          this.lineTo(x + r, y + h);
          this.quadraticCurveTo(x, y + h, x, y + h - r);
          this.lineTo(x, y + r);
          this.quadraticCurveTo(x, y, x + r, y);
          return this;
        };
      }

      // ---------- KEYBOARD CONTROLS ----------
      function handleKeydown(e) {
        // Prevent arrow keys / space from scrolling
        const key = e.key;
        const arrowKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
        const wasdKeys = ['w', 'W', 'a', 'A', 's', 'S', 'd', 'D'];
        if (arrowKeys.includes(key) || wasdKeys.includes(key) || key === ' ') {
          e.preventDefault();
        }

        // If game over, ignore directional input (but restart button handles new game)
        if (gameOver) return;

        // Map to direction
        let newDir = null;
        if (key === 'ArrowUp' || key === 'w' || key === 'W') newDir = { x: 0, y: -1 };
        else if (key === 'ArrowDown' || key === 's' || key === 'S') newDir = { x: 0, y: 1 };
        else if (key === 'ArrowLeft' || key === 'a' || key === 'A') newDir = { x: -1, y: 0 };
        else if (key === 'ArrowRight' || key === 'd' || key === 'D') newDir = { x: 1, y: 0 };

        if (newDir) {
          // Disallow 180° reversal relative to current committed direction
          if (direction.x !== -newDir.x || direction.y !== -newDir.y) {
            nextDirection = newDir;
          }
        }
      }

      // ---------- RESTART BUTTON ----------
      function handleRestart() {
        resetGame();
      }

      // ---------- INIT ----------
      function init() {
        // Set up event listeners
        window.addEventListener('keydown', handleKeydown);
        restartBtn.addEventListener('click', handleRestart);

        // Initialize the game state and start the loop
        resetGame();
      }

      // Run init when the page loads (script is at end of body, but to be safe)
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
