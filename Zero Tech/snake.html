<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐍 serpent · levels & bosses</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(145deg, #0e171f 0%, #0a1219 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
    }
    .game-wrapper {
      background: rgba(18, 28, 36, 0.85);
      backdrop-filter: blur(4px);
      border-radius: 40px;
      padding: 28px 28px 32px;
      box-shadow: 0 30px 40px -15px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(100, 220, 200, 0.15);
      max-width: 780px;
      width: fit-content;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding: 0 8px;
    }
    .title {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: #b2f0e6;
      text-shadow: 0 0 12px #3ad9c0, 0 0 30px #157a6b;
    }
    .stats {
      display: flex;
      gap: 28px;
      font-weight: 600;
      background: #101c24;
      padding: 10px 22px;
      border-radius: 60px;
      box-shadow: inset 0 2px 6px #00000055, 0 4px 10px #00000033;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #b0d4d0;
      font-size: 1.2rem;
    }
    .stat-item span:first-child {
      color: #4ec5b0;
      font-size: 0.9rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .stat-value {
      color: #f0fff8;
      font-weight: 700;
      min-width: 3rem;
      text-align: center;
      background: #1e2e38;
      padding: 2px 10px;
      border-radius: 30px;
      font-size: 1.2rem;
    }
    .canvas-container {
      position: relative;
      display: flex;
      justify-content: center;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 0 0 2px #1d3b42, 0 20px 30px -10px #000000;
    }
    canvas {
      display: block;
      width: 100%;
      max-width: 640px;
      height: auto;
      background-color: #0a141c;
      background-image: 
        linear-gradient(rgba(60, 180, 160, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(60, 180, 160, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      aspect-ratio: 1 / 1;
      cursor: pointer;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 26px;
      flex-wrap: wrap;
    }
    button {
      background: #1d313a;
      border: none;
      color: #d2f0ea;
      font-weight: 600;
      font-size: 1.1rem;
      padding: 12px 28px;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 6px 0 #0a141b, 0 6px 14px #00000055;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #3f706a;
    }
    button:hover {
      background: #264c53;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #0a141b, 0 10px 18px #00000066;
    }
    button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0a141b, 0 6px 12px #00000055;
    }
    .message {
      text-align: center;
      margin-top: 20px;
      font-size: 1.1rem;
      font-weight: 500;
      color: #8bc6bc;
      min-height: 2rem;
      letter-spacing: 0.3px;
      text-shadow: 0 0 10px #1e6055;
    }
  </style>
</head>
<body>
<div class="game-wrapper">
  <div class="header">
    <div class="title">🐍 SERPENT</div>
    <div class="stats">
      <div class="stat-item"><span>LVL</span><span id="levelDisplay" class="stat-value">1</span></div>
      <div class="stat-item"><span>SCORE</span><span id="scoreDisplay" class="stat-value">0</span></div>
      <div class="stat-item"><span>LIVES</span><span id="livesDisplay" class="stat-value">❤️ 3</span></div>
    </div>
  </div>
  <div class="canvas-container">
    <canvas id="gameCanvas" width="640" height="640"></canvas>
  </div>
  <div class="controls">
    <button id="restartButton">⟳ Restart</button>
  </div>
  <div id="messageBox" class="message">press an arrow key to begin</div>
</div>

<script>
  (function() {
    // ---------- CONFIG (faster & harder) ----------
    const GRID_SIZE = 16;
    const CELL_SIZE = 640 / GRID_SIZE;
    const BASE_INTERVAL_MS = 100;    // faster base speed (was 130)
    const MIN_INTERVAL_MS = 45;      // even faster floor (was 70)
    const SPEED_STEP_PER_LEVEL = 12; // steeper speed-up per level (was 10)
    const BOSS_START_HP = 4;         // harder boss (was 3)
    const OBSTACLES_PER_LEVEL = 2;   // new obstacles added on level-up (harder)
    
    // ---------- DOM ELEMENTS ----------
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const livesDisplay = document.getElementById('livesDisplay');
    const messageBox = document.getElementById('messageBox');
    const restartButton = document.getElementById('restartButton');
    
    // ---------- GAME STATE ----------
    let snake = [];
    let direction = null;
    let nextDirection = null;
    let food = { x: 0, y: 0 };
    let boss = null;
    let obstacles = [];              // {x, y} solid walls
    let score = 0;
    let lives = 3;
    let level = 1;
    let gameOver = false;
    let gameLoopInterval = null;
    let gameState = 'idle';          // 'idle', 'running', 'gameover'
    let bossSpawnedForLevel = new Set();
    
    // ---------- HELPERS ----------
    function getRandomInt(max) {
      return Math.floor(Math.random() * max);
    }
    
    function isCellOccupied(x, y, ignoreSnakeHead = false) {
      for (let i = 0; i < snake.length; i++) {
        if (ignoreSnakeHead && i === 0) continue;
        if (snake[i].x === x && snake[i].y === y) return true;
      }
      if (food && food.x === x && food.y === y) return true;
      if (boss && boss.x === x && boss.y === y) return true;
      for (let ob of obstacles) {
        if (ob.x === x && ob.y === y) return true;
      }
      return false;
    }
    
    // ---------- GENERATE FOOD ----------
    function generateFood() {
      const maxAttempts = 800;
      let attempts = 0;
      let newFood = null;
      while (attempts < maxAttempts) {
        const fx = getRandomInt(GRID_SIZE);
        const fy = getRandomInt(GRID_SIZE);
        if (!isCellOccupied(fx, fy, true)) {
          newFood = { x: fx, y: fy };
          break;
        }
        attempts++;
      }
      if (!newFood) {
        for (let y = 0; y < GRID_SIZE; y++) {
          for (let x = 0; x < GRID_SIZE; x++) {
            if (!isCellOccupied(x, y, true)) {
              newFood = { x, y };
              break;
            }
          }
          if (newFood) break;
        }
      }
      if (!newFood) newFood = { x: 0, y: 0 };
      return newFood;
    }
    
    // ---------- SPAWN OBSTACLES ON LEVEL-UP (harder) ----------
    function addObstacles(count) {
      for (let i = 0; i < count; i++) {
        let placed = false;
        for (let attempt = 0; attempt < 500; attempt++) {
          const ox = getRandomInt(GRID_SIZE);
          const oy = getRandomInt(GRID_SIZE);
          // don't block spawn area / snake / food / boss / other obstacles
          if (isCellOccupied(ox, oy, false)) continue;
          // avoid placing right next to snake head
          const head = snake[0];
          if (Math.abs(head.x - ox) + Math.abs(head.y - oy) < 3) continue;
          obstacles.push({ x: ox, y: oy });
          placed = true;
          break;
        }
        if (!placed) break;
      }
    }
    
    // ---------- SPAWN BOSS ----------
    function spawnBoss() {
      if (boss) return;
      
      const maxAttempts = 500;
      let attempts = 0;
      let bossPos = null;
      while (attempts < maxAttempts) {
        const bx = getRandomInt(GRID_SIZE);
        const by = getRandomInt(GRID_SIZE);
        let occupied = false;
        for (let seg of snake) {
          if (seg.x === bx && seg.y === by) { occupied = true; break; }
        }
        if (occupied) { attempts++; continue; }
        if (food && food.x === bx && food.y === by) { attempts++; continue; }
        for (let ob of obstacles) {
          if (ob.x === bx && ob.y === by) { occupied = true; break; }
        }
        if (occupied) { attempts++; continue; }
        bossPos = { x: bx, y: by };
        break;
      }
      if (!bossPos) {
        for (let y = 0; y < GRID_SIZE; y++) {
          for (let x = 0; x < GRID_SIZE; x++) {
            let free = true;
            for (let seg of snake) if (seg.x === x && seg.y === y) free = false;
            if (food && food.x === x && food.y === y) free = false;
            for (let ob of obstacles) if (ob.x === x && ob.y === y) free = false;
            if (free) { bossPos = { x, y }; break; }
          }
          if (bossPos) break;
        }
      }
      if (!bossPos) bossPos = { x: 0, y: 0 };
      
      boss = {
        x: bossPos.x,
        y: bossPos.y,
        hp: BOSS_START_HP,
        maxHp: BOSS_START_HP,
      };
      messageBox.innerText = `⚠️ BOSS ENCOUNTER! Hit it ${BOSS_START_HP} times`;
    }
    
    function removeBoss() {
      boss = null;
      messageBox.innerText = 'boss defeated! keep going';
    }
    
    // ---------- RESET ----------
    function resetGame() {
      if (gameLoopInterval) {
        clearInterval(gameLoopInterval);
        gameLoopInterval = null;
      }
      
      snake = [
        { x: 8, y: 8 },
        { x: 7, y: 8 },
        { x: 6, y: 8 },
        { x: 5, y: 8 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      lives = 3;
      level = 1;
      gameOver = false;
      gameState = 'running';
      boss = null;
      obstacles = [];
      bossSpawnedForLevel.clear();
      
      food = generateFood();
      updateUI();
      messageBox.innerText = 'Level 1 — 30 points to win';
      
      const interval = Math.max(MIN_INTERVAL_MS, BASE_INTERVAL_MS - (level - 1) * SPEED_STEP_PER_LEVEL);
      gameLoopInterval = setInterval(gameTick, interval);
      
      drawCanvas();
    }
    
    // ---------- UPDATE UI ----------
    function updateUI() {
      scoreDisplay.textContent = score;
      levelDisplay.textContent = level;
      livesDisplay.textContent = lives > 0 ? '❤️ '.repeat(lives).trim() : '💀 0';
      if (gameLoopInterval && gameState === 'running') {
        const interval = Math.max(MIN_INTERVAL_MS, BASE_INTERVAL_MS - (level - 1) * SPEED_STEP_PER_LEVEL);
        clearInterval(gameLoopInterval);
        gameLoopInterval = setInterval(gameTick, interval);
      }
    }
    
    // ---------- GAME TICK ----------
    function gameTick() {
      if (gameState !== 'running' || gameOver) return;
      
      if (nextDirection) {
        if (!(direction.x === -nextDirection.x && direction.y === -nextDirection.y)) {
          direction = { x: nextDirection.x, y: nextDirection.y };
        }
        nextDirection = null;
      }
      
      const head = snake[0];
      const newHead = {
        x: head.x + direction.x,
        y: head.y + direction.y
      };
      
      // wall collision
      if (newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE) {
        handleLifeLoss('hit the wall!');
        return;
      }
      
      // obstacle collision (new)
      for (let ob of obstacles) {
        if (newHead.x === ob.x && newHead.y === ob.y) {
          handleLifeLoss('hit an obstacle!');
          return;
        }
      }
      
      const foodEaten = (newHead.x === food.x && newHead.y === food.y);
      
      // self collision
      let selfCollision = false;
      const snakeWithoutTail = snake.slice(0, -1);
      for (let seg of snakeWithoutTail) {
        if (seg.x === newHead.x && seg.y === newHead.y) {
          selfCollision = true;
          break;
        }
      }
      if (foodEaten) {
        for (let seg of snake) {
          if (seg.x === newHead.x && seg.y === newHead.y) {
            selfCollision = true;
            break;
          }
        }
      }
      
      if (selfCollision) {
        handleLifeLoss('bit yourself!');
        return;
      }
      
      // boss collision
      if (boss && newHead.x === boss.x && newHead.y === boss.y) {
        boss.hp -= 1;
        if (boss.hp <= 0) {
          removeBoss();
          score += 2;
          if (score >= 30) {
            handleWin();
            return;
          }
          updateUI();
        } else {
          lives -= 1;
          if (lives <= 0) {
            handleLifeLoss('boss got you');
            return;
          }
          updateUI();
          messageBox.innerText = `BOSS HP: ${boss.hp}/${boss.maxHp} — lives left: ${lives}`;
        }
        drawCanvas();
        return;
      }
      
      // move snake
      snake.unshift(newHead);
      
      if (foodEaten) {
        score += 1;
        if (score >= 30) {
          handleWin();
          return;
        }
        const newLevel = Math.floor(score / 10) + 1;
        if (newLevel > level) {
          level = newLevel;
          // add obstacles (harder difficulty)
          addObstacles(OBSTACLES_PER_LEVEL);
          // spawn boss
          if (!bossSpawnedForLevel.has(level) && !boss) {
            bossSpawnedForLevel.add(level);
            spawnBoss();
          }
          // speed-up handled in updateUI
        }
        food = generateFood();
      } else {
        snake.pop();
      }
      
      updateUI();
      drawCanvas();
    }
    
    // ---------- LIFE LOSS ----------
    function handleLifeLoss(reason) {
      lives -= 1;
      if (lives <= 0) {
        gameOver = true;
        gameState = 'gameover';
        if (gameLoopInterval) {
          clearInterval(gameLoopInterval);
          gameLoopInterval = null;
        }
        updateUI();
        messageBox.innerText = `💀 GAME OVER — ${reason} — score: ${score}`;
        drawCanvas();
        return;
      }
      
      snake = [
        { x: 8, y: 8 },
        { x: 7, y: 8 },
        { x: 6, y: 8 },
        { x: 5, y: 8 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      
      // reposition boss if overlapping snake
      if (boss) {
        let bossOverlap = snake.some(seg => seg.x === boss.x && seg.y === boss.y);
        if (bossOverlap) {
          for (let y = 0; y < GRID_SIZE; y++) {
            for (let x = 0; x < GRID_SIZE; x++) {
              if (!snake.some(seg => seg.x === x && seg.y === y) && !(food.x === x && food.y === y)) {
                let free = true;
                for (let ob of obstacles) if (ob.x === x && ob.y === y) free = false;
                if (free) {
                  boss.x = x;
                  boss.y = y;
                  break;
                }
              }
            }
          }
        }
      }
      
      // reposition food if overlapping
      if (snake.some(seg => seg.x === food.x && seg.y === food.y)) {
        food = generateFood();
      }
      
      updateUI();
      messageBox.innerText = `lost a life! ${reason} — lives: ${lives}`;
      drawCanvas();
    }
    
    // ---------- WIN ----------
    function handleWin() {
      gameOver = true;
      gameState = 'gameover';
      if (gameLoopInterval) {
        clearInterval(gameLoopInterval);
        gameLoopInterval = null;
      }
      messageBox.innerText = `🏆 YOU WIN! Final score: ${score}`;
      updateUI();
      drawCanvas();
    }
    
    // ---------- DRAW ----------
    function drawCanvas() {
      ctx.clearRect(0, 0, 640, 640);
      
      // grid
      ctx.strokeStyle = 'rgba(80, 180, 160, 0.12)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID_SIZE; i++) {
        const pos = i * CELL_SIZE;
        ctx.beginPath();
        ctx.moveTo(pos, 0);
        ctx.lineTo(pos, 640);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, pos);
        ctx.lineTo(640, pos);
        ctx.stroke();
      }
      
      // obstacles
      for (let ob of obstacles) {
        const x = ob.x * CELL_SIZE;
        const y = ob.y * CELL_SIZE;
        ctx.shadowColor = '#667788';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#2a3a45';
        ctx.beginPath();
        ctx.roundRect(x + 4, y + 4, CELL_SIZE - 8, CELL_SIZE - 8, 6);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#4e6b7a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(x + 4, y + 4, CELL_SIZE - 8, CELL_SIZE - 8, 6);
        ctx.stroke();
      }
      
      // food
      ctx.shadowColor = '#ff8c5a';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#ff5e3a';
      ctx.beginPath();
      ctx.arc(food.x * CELL_SIZE + CELL_SIZE/2, food.y * CELL_SIZE + CELL_SIZE/2, CELL_SIZE/2 - 4, 0, 2*Math.PI);
      ctx.fill();
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#ffb347';
      ctx.beginPath();
      ctx.arc(food.x * CELL_SIZE + CELL_SIZE/2 - 4, food.y * CELL_SIZE + CELL_SIZE/2 - 4, CELL_SIZE/6, 0, 2*Math.PI);
      ctx.fill();
      
      // boss
      if (boss) {
        const bx = boss.x * CELL_SIZE;
        const by = boss.y * CELL_SIZE;
        ctx.shadowColor = '#dc143c';
        ctx.shadowBlur = 20;
        ctx.fillStyle = '#b22222';
        ctx.beginPath();
        ctx.arc(bx + CELL_SIZE/2, by + CELL_SIZE/2, CELL_SIZE/2 - 4, 0, 2*Math.PI);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#f0e68c';
        ctx.beginPath();
        ctx.arc(bx + CELL_SIZE/3, by + CELL_SIZE/3, 4, 0, 2*Math.PI);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(bx + (2*CELL_SIZE)/3, by + CELL_SIZE/3, 4, 0, 2*Math.PI);
        ctx.fill();
        const hpBarWidth = CELL_SIZE - 8;
        const hpRatio = boss.hp / boss.maxHp;
        ctx.fillStyle = '#222222';
        ctx.fillRect(bx + 4, by + CELL_SIZE - 8, hpBarWidth, 5);
        ctx.fillStyle = boss.hp > 1 ? '#04d9b2' : '#ff4444';
        ctx.fillRect(bx + 4, by + CELL_SIZE - 8, hpBarWidth * hpRatio, 5);
      }
      
      // snake
      snake.forEach((seg, index) => {
        const x = seg.x * CELL_SIZE;
        const y = seg.y * CELL_SIZE;
        const isHead = index === 0;
        const gradient = ctx.createRadialGradient(
          x + 10, y + 10, 4,
          x + CELL_SIZE/2, y + CELL_SIZE/2, CELL_SIZE
        );
        if (isHead) {
          gradient.addColorStop(0, '#7dfad6');
          gradient.addColorStop(1, '#1b8a75');
        } else {
          gradient.addColorStop(0, '#3ec2a0');
          gradient.addColorStop(1, '#116b5a');
        }
        ctx.shadowColor = isHead ? '#7dfad6' : '#2e9b84';
        ctx.shadowBlur = isHead ? 16 : 8;
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.roundRect(x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4, 8);
        ctx.fill();
        
        if (isHead) {
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#fbfff9';
          ctx.beginPath();
          ctx.arc(x + CELL_SIZE/3, y + CELL_SIZE/3, 5, 0, 2*Math.PI);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(x + (2*CELL_SIZE)/3, y + CELL_SIZE/3, 5, 0, 2*Math.PI);
          ctx.fill();
          ctx.fillStyle = '#0b1d1a';
          ctx.beginPath();
          ctx.arc(x + CELL_SIZE/3 + 1, y + CELL_SIZE/3 - 1, 2.5, 0, 2*Math.PI);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(x + (2*CELL_SIZE)/3 + 1, y + CELL_SIZE/3 - 1, 2.5, 0, 2*Math.PI);
          ctx.fill();
        }
      });
      
      ctx.shadowBlur = 0;
      ctx.shadowColor = 'transparent';
    }
    
    // helper
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      this.moveTo(x + r, y);
      this.lineTo(x + w - r, y);
      this.quadraticCurveTo(x + w, y, x + w, y + r);
      this.lineTo(x + w, y + h - r);
      this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      this.lineTo(x + r, y + h);
      this.quadraticCurveTo(x, y + h, x, y + h - r);
      this.lineTo(x, y + r);
      this.quadraticCurveTo(x, y, x + r, y);
      this.closePath();
      return this;
    };
    
    // ---------- KEYBOARD ----------
    function handleKeydown(e) {
      const key = e.key;
      if (key.startsWith('Arrow')) {
        e.preventDefault();
      }
      
      if (gameState === 'gameover') return;
      
      if (gameState === 'idle') {
        resetGame();
      }
      
      if (gameState !== 'running' && gameState !== 'idle') return;
      
      let newDir = null;
      if (key === 'ArrowUp') newDir = { x: 0, y: -1 };
      else if (key === 'ArrowDown') newDir = { x: 0, y: 1 };
      else if (key === 'ArrowLeft') newDir = { x: -1, y: 0 };
      else if (key === 'ArrowRight') newDir = { x: 1, y: 0 };
      
      if (newDir) {
        if (direction) {
          if (!(direction.x === -newDir.x && direction.y === -newDir.y)) {
            nextDirection = newDir;
          }
        } else {
          nextDirection = newDir;
        }
      }
    }
    
    // ---------- INITIAL ----------
    function initialSetup() {
      snake = [
        { x: 8, y: 8 },
        { x: 7, y: 8 },
        { x: 6, y: 8 },
        { x: 5, y: 8 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      food = generateFood();
      score = 0;
      lives = 3;
      level = 1;
      gameState = 'idle';
      gameOver = false;
      boss = null;
      obstacles = [];
      updateUI();
      drawCanvas();
      messageBox.innerText = 'press an arrow key to begin';
      
      window.addEventListener('keydown', handleKeydown);
      
      restartButton.addEventListener('click', (e) => {
        e.preventDefault();
        if (gameLoopInterval) {
          clearInterval(gameLoopInterval);
          gameLoopInterval = null;
        }
        resetGame();
        drawCanvas();
      });
      
      drawCanvas();
    }
    
    initialSetup();
  })();
</script>
</body>
</html>
