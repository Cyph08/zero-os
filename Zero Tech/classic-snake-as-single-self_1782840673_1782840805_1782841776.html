<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
    <style>
        /* ── Reset & base ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b0b14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            color: #e8edf2;
            margin: 0;
            padding: 16px;
        }

        /* ── Game container ── */
        #game-container {
            background: #13131f;
            border-radius: 32px;
            padding: 32px 36px 28px;
            max-width: 620px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        /* ── Title ── */
        .game-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 14px;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(0, 255, 136, 0.15);
        }

        /* ── Top bar: score + lives + level ── */
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 4px;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: 500;
            gap: 8px;
            flex-wrap: wrap;
        }
        #top-bar .stat-box {
            background: rgba(255, 255, 255, 0.04);
            padding: 5px 14px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .score-label {
            opacity: 0.6;
            font-weight: 400;
        }
        .score-value {
            color: #fff;
            font-weight: 600;
        }
        .score-value.high {
            color: #ffd866;
        }
        #lives-display {
            font-size: 18px;
            letter-spacing: 2px;
        }
        .heart {
            color: #ff4466;
        }
        .heart.lost {
            opacity: 0.25;
        }
        #multiplier-display {
            color: #ffd866;
            font-weight: 600;
            font-size: 14px;
        }
        #level-display {
            color: #88ddff;
            font-weight: 600;
            font-size: 14px;
        }
        #shield-indicator {
            color: #66ddff;
            font-weight: 600;
            font-size: 14px;
            display: none;
        }
        #shield-indicator.active {
            display: inline;
        }

        /* ── Canvas wrapper ── */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 20px;
            overflow: hidden;
            background: #0a0a12;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04), 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            background: #0a0a12;
        }

        /* ── Boss HP bar ── */
        #boss-hp-container {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            height: 12px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            overflow: hidden;
            display: none;
            border: 1px solid rgba(255, 60, 60, 0.3);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.15);
        }
        #boss-hp-container.visible {
            display: block;
        }
        #boss-hp-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff2244, #ff6644);
            border-radius: 8px;
            transition: width 0.15s ease;
        }
        #boss-hp-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        /* ── Overlays ── */
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(8, 8, 18, 0.82);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            padding: 24px;
            text-align: center;
            z-index: 5;
        }
        .overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay h2 {
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .overlay p {
            font-size: 18px;
            opacity: 0.8;
            margin: 8px 0 4px;
        }
        .overlay .sub {
            font-size: 15px;
            opacity: 0.5;
            margin-top: 14px;
            font-weight: 400;
        }

        .overlay .final-score {
            font-size: 28px;
            font-weight: 700;
            color: #00ff88;
            margin: 4px 0 12px;
        }
        .overlay .final-score span {
            color: #fff;
        }

        .btn-restart {
            margin-top: 18px;
            background: #00ff88;
            border: none;
            color: #0b0b14;
            font-size: 18px;
            font-weight: 700;
            padding: 12px 40px;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.25);
            letter-spacing: 0.3px;
        }
        .btn-restart:hover {
            transform: scale(1.04);
            box-shadow: 0 6px 30px rgba(0, 255, 136, 0.35);
            background: #10ff92;
        }
        .btn-restart:active {
            transform: scale(0.96);
        }

        /* ── Boss flash overlay ── */
        #boss-flash {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(180, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 6;
            padding: 24px;
            text-align: center;
        }
        #boss-flash.visible {
            opacity: 1;
            pointer-events: none;
        }
        #boss-flash h2 {
            font-size: 38px;
            font-weight: 800;
            color: #ff4444;
            text-shadow: 0 0 40px rgba(255, 0, 0, 0.5);
            letter-spacing: 2px;
        }
        #boss-flash .sub {
            font-size: 18px;
            color: #ffaaaa;
            margin-top: 6px;
        }

        /* ── Level cleared overlay ── */
        #level-cleared-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(8, 8, 18, 0.82);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            padding: 24px;
            text-align: center;
            z-index: 5;
        }
        #level-cleared-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #level-cleared-overlay h2 {
            font-size: 34px;
            font-weight: 700;
            color: #00ff88;
        }

        /* ── Controls hint ── */
        #controls-hint {
            margin-top: 16px;
            font-size: 14px;
            opacity: 0.35;
            letter-spacing: 0.4px;
            font-weight: 400;
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        #controls-hint kbd {
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 10px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* ── Responsive ── */
        @media (max-width: 520px) {
            #game-container {
                padding: 18px 16px 16px;
                border-radius: 24px;
            }
            .game-title {
                font-size: 22px;
                margin-bottom: 10px;
            }
            #top-bar {
                font-size: 13px;
                margin-bottom: 8px;
                gap: 4px;
            }
            #top-bar .stat-box {
                padding: 3px 10px;
            }
            #lives-display {
                font-size: 15px;
            }
            .overlay h2 {
                font-size: 26px;
            }
            .btn-restart {
                font-size: 16px;
                padding: 10px 32px;
            }
            #controls-hint {
                font-size: 12px;
            }
            #boss-flash h2 {
                font-size: 28px;
            }
        }
        @media (max-width: 400px) {
            #game-container {
                padding: 12px 10px 12px;
                border-radius: 16px;
            }
            .game-title {
                font-size: 18px;
            }
            #top-bar {
                font-size: 11px;
            }
            #top-bar .stat-box {
                padding: 2px 8px;
            }
            #lives-display {
                font-size: 13px;
            }
            .overlay h2 {
                font-size: 20px;
            }
            .btn-restart {
                font-size: 14px;
                padding: 8px 24px;
            }
            #boss-flash h2 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="game-title">⟠ SNAKE</div>

        <div id="top-bar">
            <span class="stat-box">
                <span class="score-label">Score</span>
                <span class="score-value" id="score-display">0</span>
            </span>
            <span class="stat-box">
                <span class="score-label">Best</span>
                <span class="score-value high" id="high-score-display">0</span>
            </span>
            <span class="stat-box" id="multiplier-display">×1</span>
            <span class="stat-box" id="level-display">Lv 1</span>
            <span class="stat-box" id="shield-indicator">🛡️ Shield</span>
            <span class="stat-box" id="lives-display">
                <span class="heart" id="heart1">♥</span>
                <span class="heart" id="heart2">♥</span>
                <span class="heart" id="heart3">♥</span>
            </span>
        </div>

        <div id="canvas-wrapper">
            <canvas id="game-canvas"
id="game-canvas" width="400" height="400"></canvas>
            <div id="boss-flash"><h2>⚔️ BOSS WAVE ⚔️</h2></div>
        </div>

        <div id="mobile-controls">
            <button class="ctrl-btn" id="btn-up">▲</button>
            <div style="display:flex;gap:6px;justify-content:center;">
                <button class="ctrl-btn" id="btn-left">◀</button>
                <button class="ctrl-btn" id="btn-down">▼</button>
                <button class="ctrl-btn" id="btn-right">▶</button>
            </div>
        </div>

        <div id="pause-btn">⏸</div>
    </div>

    <!-- Overlays -->
    <div class="overlay" id="overlay-start">
        <div class="overlay-box">
            <h2>⟠ SNAKE</h2>
            <p style="margin:8px 0;font-size:15px;opacity:0.8;">Use arrow keys or on-screen buttons</p>
            <p style="margin:4px 0 12px;font-size:14px;opacity:0.6;">Collect gems · Avoid walls · Survive!</p>
            <button class="btn-restart" id="btn-start">▶ PLAY</button>
            <p style="margin-top:10px;font-size:12px;opacity:0.5;">Press <kbd>Space</kbd> or <kbd>P</kbd> to pause</p>
        </div>
    </div>

    <div class="overlay" id="overlay-pause">
        <div class="overlay-box">
            <h2>⏸ PAUSED</h2>
            <button class="btn-restart" id="btn-resume">▶ RESUME</button>
        </div>
    </div>

    <div class="overlay" id="overlay-gameover">
        <div class="overlay-box">
            <h2>💀 GAME OVER</h2>
            <p style="font-size:18px;margin:6px 0;">Score: <strong id="final-score">0</strong></p>
            <p style="font-size:14px;margin:4px 0 12px;opacity:0.7;">Best: <strong id="final-high">0</strong></p>
            <button class="btn-restart" id="btn-restart">🔄 PLAY AGAIN</button>
        </div>
    </div>

    <script>
        // ============== GAME ==============
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const W = 400, H = 400;
        const TILE = 20;
        const COLS = W / TILE, ROWS = H / TILE;

        // DOM refs
        const scoreDisplay = document.getElementById('score-display');
        const highScoreDisplay = document.getElementById('high-score-display');
        const multiplierDisplay = document.getElementById('multiplier-display');
        const levelDisplay = document.getElementById('level-display');
        const shieldIndicator = document.getElementById('shield-indicator');
        const hearts = [document.getElementById('heart1'), document.getElementById('heart2'), document.getElementById('heart3')];
        const finalScore = document.getElementById('final-score');
        const finalHigh = document.getElementById('final-high');
        const bossFlash = document.getElementById('boss-flash');

        const overlayStart = document.getElementById('overlay-start');
        const overlayPause = document.getElementById('overlay-pause');
        const overlayGameover = document.getElementById('overlay-gameover');

        // Buttons
        const btnStart = document.getElementById('btn-start');
        const btnResume = document.getElementById('btn-resume');
        const btnRestart = document.getElementById('btn-restart');
        const btnUp = document.getElementById('btn-up');
        const btnDown = document.getElementById('btn-down');
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const pauseBtn = document.getElementById('pause-btn');

        // ---------- GAME STATE ----------
        let snake = [];
        let food = {};
        let powerup = null;          // {x, y, type, timer}
        let obstacles = [];
        let particles = [];
        let floatingTexts = [];
        let stars = [];

        let dir = { dx: 0, dy: 0 };
        let nextDir = { dx: 0, dy: 0 };
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
        let level = 1;
        let multiplier = 1;
        let lives = 3;
        let shield = false;
        let invincible = false;
        let invTimer = 0;
        let bossActive = false;
        let bossTimer = 0;
        let bossCooldown = 0;
        let gameRunning = false;
        let paused = false;
        let gameOver = false;
        let speed = 150;
        let moveTimer = 0;
        let lastTime = 0;
        let animFrame = 0;

        // Grid helpers
        function randomTile() {
            return {
                x: Math.floor(Math.random() * COLS),
                y: Math.floor(Math.random() * ROWS)
            };
        }

        function isOccupied(x, y, ignoreHead = false) {
            for (let i = ignoreHead ? 1 : 0; i < snake.length; i++) {
                if (snake[i].x === x && snake[i].y === y) return true;
            }
            return false;
        }

        function isObstacle(x, y) {
            return obstacles.some(o => o.x === x && o.y === y);
        }

        function isEmptyCell(x, y) {
            if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return false;
            if (isOccupied(x, y)) return false;
            if (isObstacle(x, y)) return false;
            return true;
        }

        function spawnFood() {
            let tries = 0;
            let pos;
            do {
                pos = randomTile();
                tries++;
            } while (!isEmptyCell(pos.x, pos.y) && tries < 100);
            if (tries < 100) {
                food = { x: pos.x, y: pos.y, type: 'normal', pulse: 0 };
            } else {
                // No space — win condition?
                food = null;
            }
        }

        function spawnPowerup() {
            if (powerup) return;
            let tries = 0;
            let pos;
            do {
                pos = randomTile();
                tries++;
            } while (!isEmptyCell(pos.x, pos.y) && tries < 100);
            if (tries < 100) {
                const types = ['multiplier', 'shield', 'life', 'speed'];
                const type = types[Math.floor(Math.random() * types.length)];
                powerup = { x: pos.x, y: pos.y, type: type, timer: 300 }; // 5 sec at 60fps
            }
        }

        function spawnObstacles() {
            obstacles = [];
            const count = Math.min(level + 2, 12);
            for (let i = 0; i < count; i++) {
                let tries = 0;
                let pos;
                do {
                    pos = randomTile();
                    tries++;
                } while (!isEmptyCell(pos.x, pos.y) && tries < 100);
                if (tries < 100) {
                    obstacles.push({ x: pos.x, y: pos.y });
                }
            }
        }

        function spawnStars() {
            stars = [];
            for (let i = 0; i < 40; i++) {
                stars.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: Math.random() * 1.5 + 0.5,
                    a: Math.random() * 0.5 + 0.3,
                    speed: Math.random() * 0.3 + 0.1
                });
            }
        }

        // ---------- PARTICLES ----------
        function addParticles(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * 2 * Math.PI;
                const speed = Math.random() * 2 + 1;
                particles.push({
                    x: x * TILE + TILE / 2,
                    y: y * TILE + TILE / 2,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    decay: Math.random() * 0.03 + 0.02,
                    size: Math.random() * 4 + 2,
                    color: color
                });
            }
        }

        function addFloatingText(x, y, text, color = '#fff') {
            floatingTexts.push({
                x: x * TILE + TILE / 2,
                y: y * TILE + TILE / 2,
                text: text,
                color: color,
                life: 1,
                vy: -1.5
            });
        }

        // ---------- INIT ----------
        function initGame() {
            snake = [
                { x: Math.floor(COLS / 2), y: Math.floor(ROWS / 2) }
            ];
            dir = { dx: 1, dy: 0 };
            nextDir = { dx: 1, dy: 0 };
            score = 0;
            level = 1;
            multiplier = 1;
            lives = 3;
            shield = false;
            invincible = false;
            invTimer = 0;
            bossActive = false;
            bossTimer = 0;
            bossCooldown = 0;
            speed = 150;
            powerup = null;
            particles = [];
            floatingTexts = [];
            obstacles = [];
            gameOver = false;
            paused = false;
            gameRunning = true;
            updateUI();
            spawnFood();
            spawnObstacles();
            bossFlash.classList.remove('show');
            overlayGameover.classList.remove('show');
            overlayPause.classList.remove('show');
            overlayStart.classList.remove('show');
            pauseBtn.style.display = 'block';
        }

        // ---------- UI ----------
        function updateUI() {
            scoreDisplay.textContent = score;
            highScoreDisplay.textContent = highScore;
            multiplierDisplay.textContent = '×' + multiplier;
            levelDisplay.textContent = 'Lv ' + level;
            shieldIndicator.style.display = shield ? 'inline-block' : 'none';
            for (let i = 0; i < 3; i++) {
                hearts[i].style.opacity = i < lives ? 1 : 0.2;
            }
        }

        // ---------- BOSS FLASH ----------
        function triggerBossFlash() {
            bossFlash.classList.add('show');
            setTimeout(() => {
                bossFlash.classList.remove('show');
            }, 1200);
        }

        // ---------- LEVEL UP ----------
        function levelUp() {
            level++;
            speed = Math.max(60, speed - 8);
            multiplier = Math.min(5, 1 + Math.floor(level / 2));
            spawnObstacles();
            updateUI();
            addFloatingText(snake[0].x, snake[0].y - 1, 'LEVEL ' + level + '!', '#ffd700');
            // Boss wave every 3 levels
            if (level % 3 === 0) {
                bossActive = true;
                bossTimer = 180; // 3 sec
                triggerBossFlash();
                // Grant shield on boss wave
                shield = true;
                updateUI();
                addFloatingText(snake[0].x, snake[0].y - 2, '🛡️ SHIELD', '#00ffff');
            }
        }

        // ---------- COLLISION ----------
        function checkCollisions() {
            const head = snake[0];
            // Wall
            if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                return 'wall';
            }
            // Self (skip head)
            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    return 'self';
                }
            }
            // Obstacles
            if (isObstacle(head.x, head.y)) {
                return 'obstacle';
            }
            return null;
        }

        // ---------- MOVE SNAKE ----------
        function moveSnake() {
            if (paused || gameOver || !gameRunning) return;

            dir = { dx: nextDir.dx, dy: nextDir.dy };
            const head = snake[0];
            const newHead = {
                x: head.x + dir.dx,
                y: head.y + dir.dy
            };
            snake.unshift(newHead);

            // Check food
            let ate = false;
            if (food && newHead.x === food.x && newHead.y === food.y) {
                ate = true;
                const points = 10 * multiplier;
                score += points;
                addParticles(food.x, food.y, '#ff6b6b');
                addFloatingText(food.x, food.y, '+' + points, '#ff6b6b');
                spawnFood();
                // Check level up
                const foodNeeded = 5 + level * 2;
                if (score >= foodNeeded * 10) {
                    levelUp();
                }
                // Maybe spawn powerup
                if (Math.random() < 0.2) {
                    spawnPowerup();
                }
            }

            // Check powerup
            if (powerup && newHead.x === powerup.x && newHead.y === powerup.y) {
                const type = powerup.type;
                addParticles(powerup.x, powerup.y, '#00ff88', 12);
                switch (type) {
                    case 'multiplier':
                        multiplier = Math.min(5, multiplier + 1);
                        addFloatingText(powerup.x, powerup.y, '×' + multiplier, '#ffd700');
                        break;
                    case 'shield':
                        shield = true;
                        addFloatingText(powerup.x, powerup.y, '🛡️', '#00ffff');
                        break;
                    case 'life':
                        if (lives < 3) {
                            lives++;
                            addFloatingText(powerup.x, powerup.y, '+1 ❤️', '#ff6b6b');
                        } else {
                            score += 20;
                            addFloatingText(powerup.x, powerup.y, '+20', '#ffd700');
                        }
                        break;
                    case 'speed':
                        speed = Math.max(50, speed - 10);
                        addFloatingText(powerup.x, powerup.y, '⚡ FAST', '#ffff00');
                        break;
                }
                powerup = null;
                updateUI();
            }

            // If not ate, remove tail
            if (!ate) {
                snake.pop();
            }

            // Collision detection AFTER move
            const collision = checkCollisions();
            if (collision) {
                if (shield) {
                    // Shield absorbs
                    shield = false;
                    invincible = true;
                    invTimer = 60;
                    addParticles(snake[0].x, snake[0].y, '#00ffff', 20);
                    addFloatingText(snake[0].x, snake[0].y, '🛡️ BLOCK!', '#00ffff');
                    // Remove obstacle if that was the cause
                    if (collision === 'obstacle') {
                        const idx = obstacles.findIndex(o => o.x === snake[0].x && o.y === snake[0].y);
                        if (idx !== -1) obstacles.splice(idx, 1);
                    }
                    // Push snake back
                    snake[0] = { x: snake[0].x - dir.dx, y: snake[0].y - dir.dy };
                    updateUI();
                    return;
                } else {
                    // Lose a life
                    lives--;
                    if (lives <= 0) {
                        gameOver = true;
                        gameRunning = false;
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('snakeHighScore', highScore);
                        }
                        finalScore.textContent = score;
                        finalHigh.textContent = highScore;
                        overlayGameover.classList.add('show');
                        pauseBtn.style.display = 'none';
                        updateUI();
                        return;
                    } else {
                        // Respawn snake at safe position
                        invincible = true;
                        invTimer = 90;
                        // Find safe spot
                        let safe = false;
                        for (let y = 0; y < ROWS && !safe; y++) {
                            for (let x = 0; x < COLS && !safe; x++) {
                                if (isEmptyCell(x, y)) {
                                    snake = [{ x, y }];
                                    dir = { dx: 1, dy: 0 };
                                    nextDir = { dx: 1, dy: 0 };
                                    safe = true;
                                }
                            }
                        }
                        if (!safe) {
                            gameOver = true;
                            gameRunning = false;
                            if (score > highScore) {
                                highScore = score;
                                localStorage.setItem('snakeHighScore', highScore);
                            }
                            finalScore.textContent = score;
                            finalHigh.textContent = highScore;
                            overlayGameover.classList.add('show');
                            pauseBtn.style.display = 'none';
                            updateUI();
                            return;
                        }
                        addParticles(snake[0].x, snake[0].y, '#ff6b6b', 15);
                        addFloatingText(snake[0].x, snake[0].y, '💔', '#ff6b6b');
                        updateUI();
                        return;
                    }
                }
            }

            // Decrease powerup timer
            if (powerup) {
                powerup.timer--;
                if (powerup.timer <= 0) {
                    powerup = null;
                }
            }

            // Boss timer
            if (bossActive) {
                bossTimer--;
                if (bossTimer <= 0) {
                    bossActive = false;
                    bossCooldown = 120;
                }
            }
            if (bossCooldown > 0) bossCooldown--;

            // Invincibility
            if (invincible) {
                invTimer--;
                if (invTimer <= 0) {
                    invincible = false;
                }
            }

            updateUI();
        }

        // ---------- RENDER ----------
        function render() {
            ctx.clearRect(0, 0, W, H);

            // Background
            const grad = ctx.createRadialGradient(200, 200, 50, 200, 200, 300);
            grad.addColorStop(0, '#0a0a1a');
            grad.addColorStop(1, '#000005');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // Stars
            for (const s of stars) {
                ctx.globalAlpha = s.a * (0.8 + 0.2 * Math.sin(animFrame * 0.02 + s.x));
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Grid (subtle)
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 0.5;
            for (let x = 0; x <= W; x += TILE) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, H);
                ctx.stroke();
            }
            for (let y = 0; y <= H; y += TILE) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke();
            }

            // Obstacles
            for (const o of obstacles) {
                const pulse = 0.7 + 0.3 * Math.sin(animFrame * 0.04 + o.x + o.y);
                ctx.fillStyle = `rgba(255, 50, 50, ${pulse})`;
                ctx.shadowColor = '#ff3333';
                ctx.shadowBlur = 8;
                const pad = 2;
                ctx.fillRect(o.x * TILE + pad, o.y * TILE + pad, TILE - pad * 2, TILE - pad * 2);
                ctx.shadowBlur = 0;
                // Inner glow
                ctx.fillStyle = 'rgba(255,100,100,0.2)';
                ctx.fillRect(o.x * TILE + 4, o.y * TILE + 4, TILE - 8, TILE - 8);
            }

            // Food
            if (food) {
                food.pulse = (food.pulse + 0.05) % (Math.PI * 2);
                const r = 6 + 2 * Math.sin(food.pulse);
                ctx.shadowColor = '#ff6b6b';
                ctx.shadowBlur = 15;
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.arc(food.x * TILE + TILE / 2, food.y * TILE + TILE / 2, r, 0, Math.PI * 2);
                ctx.fill();
                // Inner
                ctx.shadowBlur = 5;
                ctx.fillStyle = '#ff9999';
                ctx.beginPath();
                ctx.arc(food.x * TILE + TILE / 2, food.y * TILE + TILE / 2, r * 0.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Powerup
            if (powerup) {
                const pulse = 0.6 + 0.4 * Math.sin(animFrame * 0.08);
                ctx.shadowBlur = 20;
                let color, symbol;
                switch (powerup.type) {
                    case 'multiplier': color = '#ffd700';
                        symbol = '×2';
                        break;
                    case 'shield': color = '#00ffff';
                        symbol = '🛡';
                        break;
                    case 'life': color = '#ff6b6b';
                        symbol = '♥';
                        break;
                    case 'speed': color = '#ffff00';
                        symbol = '⚡';
                        break;
                }
                ctx.shadowColor = color;
                ctx.globalAlpha = pulse;
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(powerup.x * TILE + TILE / 2, powerup.y * TILE + TILE / 2, TILE / 2 - 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#000';
                ctx.font = 'bold 12px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(symbol, powerup.x * TILE + TILE / 2, powerup.y * TILE + TILE / 2);
            }

            // Snake
            for (let i = 0; i < snake.length; i++) {
                const seg = snake[i];
                const x = seg.x * TILE;
                const y = seg.y * TILE;
                const isHead = i === 0;

                // Body gradient
                const t = i / Math.max(snake.length - 1, 1);
                const hue = 120 + t * 60;
                const light = isHead ? 60 : 40 + t * 20;
                ctx.shadowBlur = isHead ? 20 : 8;
                ctx.shadowColor = isHead ? '#00ff88' : '#008844';

                if (isHead) {
                    // Head shape with eyes
                    ctx.fillStyle = '#00ff88';
                    ctx.shadowColor = '#00ff88';
                    ctx.shadowBlur = 25;
                    const pad = 2;
                    ctx.beginPath();
                    const cx = x + TILE / 2,
                        cy = y + TILE / 2;
                    const r = TILE / 2 - pad;
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    // Eyes
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(cx - 4, cy - 3, 2.5, 0, Math.PI * 2);
                    ctx.arc(cx + 4, cy - 3, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(cx - 4, cy - 4, 1, 0, Math.PI * 2);
                    ctx.arc(cx + 4, cy - 4, 1, 0, Math.PI * 2);
                    ctx.fill();
                    // Invincibility glow
                    if (invincible) {
                        ctx.shadowBlur = 30;
                        ctx.shadowColor = '#00ffff';
                        ctx.strokeStyle = 'rgba(0,255,255,0.3)';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(cx, cy, r + 4, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                    }
                } else {
                    // Body segments with rounded rect
                    const pad = 3;
                    ctx.fillStyle = `hsl(${hue}, 80%, ${light}%)`;
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = `hsl(${hue}, 60%, 30%)`;
                    const r = 4;
                    const bx = x + pad,
                        by = y + pad,
                        bw = TILE - pad * 2,
                        bh = TILE - pad * 2;
                    ctx.beginPath();
                    ctx.moveTo(bx + r, by);
                    ctx.lineTo(bx + bw - r, by);
                    ctx.quadraticCurveTo(bx + bw, by, bx + bw, by + r);
                    ctx.lineTo(bx + bw, by + bh - r);
                    ctx.quadraticCurveTo(bx + bw, by + bh, bx + bw - r, by + bh);
                    ctx.lineTo(bx + r, by + bh);
                    ctx.quadraticCurveTo(bx, by + bh, bx, by + bh - r);
                    ctx.lineTo(bx, by + r);
                    ctx.quadraticCurveTo(bx, by, bx + r, by);
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    // Small scale pattern
                    if (i % 2 === 0) {
                        ctx.fillStyle = 'rgba(255,255,255,0.05)';
                        ctx.fillRect(x + 6, y + 6, 8, 8);
                    }
                }
            }
            ctx.shadowBlur = 0;

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            ctx.globalAlpha = 1;

            // Floating texts
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y += ft.vy;
                ft.life -= 0.02;
                if (ft.life <= 0) {
                    floatingTexts.splice(i, 1);
                    continue;
                }
                ctx.globalAlpha = ft.life;
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 16px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowBlur = 12;
                ctx.shadowColor = ft.color;
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.shadowBlur = 0;
            }
            ctx.globalAlpha = 1;

            // Boss wave overlay indicator
            if (bossActive) {
                ctx.fillStyle = `rgba(255, 50, 50, ${0.1 + 0.05 * Math.sin(animFrame * 0.1)})`;
                ctx.fillRect(0, 0, W, H);
                ctx.strokeStyle = `rgba(255, 50, 50, ${0.3 + 0.2 * Math.sin(animFrame * 0.08)})`;
                ctx.lineWidth = 3;
                ctx.strokeRect(4, 4, W - 8, H - 8);
            }

            animFrame++;
        }

        // ---------- GAME LOOP ----------
        function gameLoop(timestamp) {
            if (!gameRunning && !gameOver) {
                requestAnimationFrame(gameLoop);
                return;
            }

            const delta = timestamp - lastTime;
            lastTime = timestamp;

            if (!paused && !gameOver && gameRunning) {
                moveTimer += delta;
                if (moveTimer >= speed) {
                    moveTimer = 0;
                    moveSnake();
                }
            }

            render();

            // Update stars slowly
            for (const s of stars) {
                s.y += s.speed * 0.2;
                if (s.y > H) { s.y = 0;
                    s.x = Math.random() * W; }
            }

            requestAnimationFrame(gameLoop);
        }

        // ---------- INPUT ----------
        function setDirection(dx, dy) {
            if (gameOver || !gameRunning) return;
            // Prevent 180° turn
            if (dir.dx === -dx && dir.dy === -dy) return;
            // Prevent moving into self on 2-seg snake
            if (snake.length > 1 && snake[1].x === snake[0].x + dx && snake[1].y === snake[0].y + dy) return;
            nextDir = { dx, dy };
        }

        document.addEventListener('keydown', (e) => {
            const key = e.key;
            if (key === 'ArrowUp') { e.preventDefault();
                setDirection(0, -1); }
            if (key === 'ArrowDown') { e.preventDefault();
                setDirection(0, 1); }
            if (key === 'ArrowLeft') { e.preventDefault();
                setDirection(-1, 0); }
            if (key === 'ArrowRight') { e.preventDefault();
                setDirection(1, 0); }
            if (key === ' ' || key === 'p' || key === 'P') {
                e.preventDefault();
                if (gameRunning && !gameOver) {
                    paused = !paused;
                    overlayPause.classList.toggle('show', paused);
                    pauseBtn.textContent = paused ? '▶' : '⏸';
                }
            }
            if (key === 'Enter' && gameOver) {
                initGame();
            }
        });

        // Mobile buttons
        btnUp.addEventListener('click', () => setDirection(0, -1));
        btnDown.addEventListener('click', () => setDirection(0, 1));
        btnLeft.addEventListener('click', () => setDirection(-1, 0));
        btnRight.addEventListener('click', () => setDirection(1, 0));

        // Touch drag support
        let touchStartX = 0,
            touchStartY = 0;
        canvas.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            touchStartX = t.clientX;
            touchStartY = t.clientY;
        }, { passive: true });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const t = e.touches[0];
            const dx = t.clientX - touchStartX;
            const dy = t.clientY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 20) {
                setDirection(dx > 0 ? 1 : -1, 0);
                touchStartX = t.clientX;
                touchStartY = t.clientY;
            } else if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 20) {
                setDirection(0, dy > 0 ? 1 : -1);
                touchStartX = t.clientX;
                touchStartY = t.clientY;
            }
        }, { passive: false });

        // Buttons
        btnStart.addEventListener('click', () => {
            initGame();
        });
        btnResume.addEventListener('click', () => {
            paused = false;
            overlayPause.classList.remove('show');
            pauseBtn.textContent = '⏸';
        });
        btnRestart.addEventListener('click', () => {
            initGame();
        });
        pauseBtn.addEventListener('click', () => {
            if (gameRunning && !gameOver) {
                paused = !paused;
                overlayPause.classList.toggle('show', paused);
                pauseBtn.textContent = paused ? '▶' : '⏸';
            }
        });

        // ---------- START ----------
        spawnStars();
        overlayStart.classList.add('show');
        pauseBtn.style.display = 'none';
        // Set initial high score display
        highScoreDisplay.textContent = highScore;
        // Begin loop
        lastTime = performance.now();
        gameRunning = true;
        requestAnimationFrame(gameLoop);

        // Auto-start on any key if overlay start is showing
        document.addEventListener('keydown', function autoStart(e) {
            if (overlayStart.classList.contains('show')) {
                initGame();
                document.removeEventListener('keydown', autoStart);
            }
        });
    </script>
</body>
</html>
