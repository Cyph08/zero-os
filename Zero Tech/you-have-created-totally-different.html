<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Snake</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #1b1e3a 0%, #070810 70%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #eaf2ff;
      padding: 18px;
      overflow: hidden;
    }
    .wrapper {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      width: 100%;
      max-width: 520px;
    }
    header {
      display: flex;
      width: 100%;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
    }
    h1 {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #4ff0c0, #29b6f6, #b06bff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 12px rgba(79, 240, 192, 0.4));
    }
    .stats {
      display: flex;
      gap: 14px;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #8fa0c8;
    }
    .stats span b { color: #4ff0c0; font-size: 1rem; }
    .canvas-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 20px;
      background: #0b0e1c;
      box-shadow: 0 0 0 1px rgba(79,240,192,0.18), 0 0 40px rgba(41,182,246,0.18), inset 0 0 60px rgba(0,0,0,0.8);
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      padding: 24px;
      background: rgba(7, 8, 16, 0.82);
      backdrop-filter: blur(6px);
      transition: opacity 0.25s ease;
      z-index: 5;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay h2 {
      font-size: clamp(1.3rem, 4.5vw, 1.9rem);
      letter-spacing: 0.05em;
      color: #fff;
    }
    .overlay p { color: #8fa0c8; font-size: 0.92rem; max-width: 320px; line-height: 1.5; }
    button.btn {
      cursor: pointer;
      border: none;
      border-radius: 999px;
      padding: 13px 34px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #04121a;
      background: linear-gradient(90deg, #4ff0c0, #29b6f6);
      box-shadow: 0 0 24px rgba(41, 182, 246, 0.45);
      transition: transform 0.12s ease, box-shadow 0.2s ease;
    }
    button.btn:hover { transform: translateY(-2px); box-shadow: 0 0 36px rgba(79, 240, 192, 0.7); }
    button.btn:active { transform: translateY(0); }
    .controls {
      display: flex;
      width: 100%;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .controls button {
      background: rgba(79, 240, 192, 0.08);
      border: 1px solid rgba(79, 240, 192, 0.35);
      color: #4ff0c0;
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease;
    }
    .controls button:hover { background: rgba(79, 240, 192, 0.2); color: #bafff0; }
    .hint {
      font-size: 0.78rem;
      color: #5f6d92;
      letter-spacing: 0.04em;
      text-align: center;
    }
    .hint kbd {
      background: #161a2e;
      border: 1px solid #2a3255;
      border-radius: 6px;
      padding: 1px 6px;
      font-family: inherit;
      color: #a9b8e0;
      font-size: 0.75rem;
    }
    @media (max-width: 420px) {
      .stats { gap: 10px; font-size: 0.72rem; }
      .controls button { padding: 9px 13px; font-size: 0.7rem; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <h1>Neon Snake</h1>
      <div class="stats">
        <span>Score <b id="score">0</b></span>
        <span>Best <b id="best">0</b></span>
      </div>
    </header>

    <div class="canvas-wrap">
      <canvas id="game"></canvas>

      <div class="overlay" id="overlay">
        <h2 id="overlayTitle">Neon Snake</h2>
        <p id="overlayText">Eat the glowing orbs, grow longer, and don't bite yourself. Use arrow keys or WASD.</p>
        <button class="btn" id="startBtn">Play</button>
      </div>
    </div>

    <div class="controls">
      <button id="pauseBtn">Pause</button>
      <button id="restartBtn">Restart</button>
      <button id="speedBtn">Speed: Normal</button>
    </div>

    <p class="hint">
      <kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to move &middot; <kbd>Space</kbd> to pause
    </p>
  </div>

  <script>
    (function () {
      'use strict';

      // ---------- Constants ----------
      const GRID = 20;                 // cells per row/column
      const COLORS = {
        grid: '#101427',
        gridLine: 'rgba(79,240,192,0.05)',
        snakeHead: '#4ff0c0',
        snakeBody: '#29b6f6',
        snakeTail: '#b06bff',
        food: '#ff5d8f',
        foodGlow: 'rgba(255,93,143,0.6)'
      };

      const SPEEDS = {
        slow:   { label: 'Slow',    interval: 180 },
        normal: { label: 'Normal',  interval: 120 },
        fast:   { label: 'Fast',    interval: 80  }
      };
      const SPEED_KEYS = ['slow', 'normal', 'fast'];

      // ---------- DOM refs ----------
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayText = document.getElementById('overlayText');
      const startBtn = document.getElementById('startBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const restartBtn = document.getElementById('restartBtn');
      const speedBtn = document.getElementById('speedBtn');

      // ---------- State ----------
      let cells = [];          // 2D array of {x, y} cell centers — unused, we compute directly
      let snake = [];          // array of {x, y} grid coords, head first
      let dir = { x: 1, y: 0 };
      let nextDir = { x: 1, y: 0 };
      let food = { x: 0, y: 0 };
      let score = 0;
      let best = 0;
      let running = false;
      let paused = false;
      let gameOver = false;
      let speedKey = 'normal';
      let stepInterval = SPEEDS.normal.interval;
      let accumulator = 0;
      let lastTime = 0;
      let rafId = null;

      // ---------- Canvas sizing (HiDPI aware) ----------
      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const size = Math.max(rect.width, 1);
        canvas.width = Math.round(size * dpr);
        canvas.height = Math.round(size * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw();
      }

      // ---------- Helpers ----------
      function cellSize() {
        const rect = canvas.getBoundingClientRect();
        return rect.width / GRID;
      }

      function gridToPx(gx, gy) {
        const cs = cellSize();
        return { x: gx * cs, y: gy * cs, size: cs };
      }

      function randomFood() {
        const occupied = new Set(snake.map(s => s.x + ',' + s.y));
        const free = [];
        for (let y = 0; y < GRID; y++) {
          for (let x = 0; x < GRID; x++) {
            if (!occupied.has(x + ',' + y)) free.push({ x, y });
          }
        }
        if (free.length === 0) return { x: -1, y: -1 }; // win state
        return free[Math.floor(Math.random() * free.length)];
      }

      // ---------- Game logic ----------
      function resetGame() {
        const mid = Math.floor(GRID / 2);
        snake = [
          { x: mid,     y: mid },
          { x: mid - 1, y: mid },
          { x: mid - 2, y: mid }
        ];
        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        score = 0;
        gameOver = false;
        paused = false;
        accumulator = 0;
        food = randomFood();
        scoreEl.textContent = '0';
        updateOverlay();
        draw();
      }

      function step() {
        // apply buffered direction (prevent 180° reversal)
        if (nextDir.x !== -dir.x || nextDir.y !== -dir.y) {
          dir = nextDir;
        }

        const head = snake[0];
        const newHead = { x: head.x + dir.x, y: head.y + dir.y };

        // wall collision
        if (newHead.x < 0 || newHead.x >= GRID || newHead.y < 0 || newHead.y >= GRID) {
          endGame();
          return;
        }

        // self collision (ignore tail tip, which will move)
        for (let i = 0; i < snake.length - 1; i++) {
          if (snake[i].x === newHead.x && snake[i].y === newHead.y) {
            endGame();
            return;
          }
        }

        snake.unshift(newHead);

        if (newHead.x === food.x && newHead.y === food.y) {
          score += 1;
          scoreEl.textContent = String(score);
          if (score > best) {
            best = score;
            bestEl.textContent = String(best);
            try { localStorage.setItem('neonSnakeBest', String(best)); } catch (e) {}
          }
          food = randomFood();
          if (food.x === -1) {
            // Board filled — player wins
            endGame(true);
          }
        } else {
          snake.pop();
        }

        draw();
      }

      function endGame(win) {
        running = false;
        gameOver = true;
        if (win) {
          overlayTitle.textContent = 'Perfect!';
          overlayText.textContent = 'You filled the entire board. Legendary.';
          startBtn.textContent = 'Play Again';
        } else {
          overlayTitle.textContent = 'Game Over';
          overlayText.textContent = 'You scored ' + score + '. Try again and beat your best!';
          startBtn.textContent = 'Play Again';
        }
        overlay.classList.remove('hidden');
        cancelAnimationFrame(rafId);
        rafId = null;
      }

      // ---------- Rendering ----------
      function draw() {
        const rect = canvas.getBoundingClientRect();
        const w = rect.width;
        const h = rect.height;
        const cs = cellSize();

        // background
        ctx.fillStyle = '#0b0e1c';
        ctx.fillRect(0, 0, w, h);

        // subtle grid lines
        ctx.strokeStyle = COLORS.gridLine;
        ctx.lineWidth = 1;
        for (let i = 1; i < GRID; i++) {
          const p = Math.round(i * cs) + 0.5;
          ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, h); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(w, p); ctx.stroke();
        }

        // food (glowing orb)
        if (food && food.x >= 0) {
          const f = gridToPx(food.x, food.y);
          const cx = f.x + f.size / 2;
          const cy = f.y + f.size / 2;
          const r = f.size * 0.32;

          const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, f.size * 0.9);
          glow.addColorStop(0, 'rgba(255,93,143,0.55)');
          glow.addColorStop(1, 'rgba(255,93,143,0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(cx, cy, f.size * 0.9, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = COLORS.food;
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(cx - r * 0.3, cy - r * 0.3, r * 0.32, 0, Math.PI * 2);
          ctx.fill();
        }

        // snake
        for (let i = snake.length - 1; i >= 0; i--) {
          const seg = snake[i];
          const s = gridToPx(seg.x, seg.y);
          const pad = s.size * 0.09;
          const rad = s.size * 0.28;

          const t = snake.length > 1 ? i / (snake.length - 1) : 0;
          let color;
          if (i === 0) {
            color = COLORS.snakeHead;
          } else {
            // interpolate body -> tail
            color = mixColors(COLORS.snakeBody, COLORS.snakeTail, t);
          }

          // glow for head
          if (i === 0) {
            ctx.shadowColor = 'rgba(79,240,192,0.9)';
            ctx.shadowBlur = 18;
          } else {
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
          }

          ctx.fillStyle = color;
          roundRect(s.x + pad, s.y + pad, s.size - pad * 2, s.size - pad * 2, rad);
          ctx.fill();
        }
        ctx.shadowBlur = 0;

        // eyes on head
        if (snake.length > 0 && !gameOver) {
          const headSeg = snake[0];
          const s = gridToPx(headSeg.x, headSeg.y);
          const cx = s.x + s.size / 2;
          const cy = s.y + s.size / 2;
          const eo = s.size * 0.2; // eye offset perpendicular
          const ed = s.size * 0.16; // eye offset forward
          const er = s.size * 0.09;

          let ex1, ey1, ex2, ey2;
          if (dir.x === 1)      { ex1 = cx + ed; ey1 = cy - eo; ex2 = cx + ed; ey2 = cy + eo; }
          else if (dir.x === -1){ ex1 = cx - ed; ey1 = cy - eo; ex2 = cx - ed; ey2 = cy + eo; }
          else if (dir.y === 1) { ex1 = cx - eo; ey1 = cy + ed; ex2 = cx + eo; ey2 = cy + ed; }
          else                  { ex1 = cx - eo; ey1 = cy - ed; ex2 = cx + eo; ey2 = cy - ed; }

          ctx.fillStyle = '#04121a';
          ctx.beginPath(); ctx.arc(ex1, ey1, er, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(ex2, ey2, er, 0, Math.PI * 2); ctx.fill();
        }
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      // hex color mixing
      function hexToRgb(hex) {
        const v = hex.replace('#', '');
        return {
          r: parseInt(v.substring(0, 2), 16),
          g: parseInt(v.substring(2, 4), 16),
          b: parseInt(v.substring(4, 6), 16)
        };
      }
      function mixColors(a, b, t) {
        const ca = hexToRgb(a), cb = hexToRgb(b);
        const r = Math.round(ca.r + (cb.r - ca.r) * t);
        const g = Math.round(ca.g + (cb.g - ca.g) * t);
        const bl = Math.round(ca.b + (cb.b - ca.b) * t);
        return 'rgb(' + r + ',' + g + ',' + bl + ')';
      }

      // ---------- Main loop ----------
      function loop(timestamp) {
        if (!running) return;
        if (!lastTime) lastTime = timestamp;
        const dt = Math.min(timestamp - lastTime, 100);
        lastTime = timestamp;

        if (!paused) {
          accumulator += dt;
          while (accumulator >= stepInterval) {
            accumulator -= stepInterval;
            step();
            if (!running) break; // game over during step
          }
        }

        draw();
        rafId = requestAnimationFrame(loop);
      }

      // ---------- Controls ----------
      function startGame() {
        resetGame();
        if (rafId) cancelAnimationFrame(rafId);
        overlay.classList.add('hidden');
        running = true;
        paused = false;
        accumulator = 0;
        lastTime = 0;
        rafId = requestAnimationFrame(loop);
      }

      function togglePause() {
        if (!running) {
          // if game over, restart
          if (gameOver) startGame();
          return;
        }
        paused = !paused;
        updateOverlay();
        if (!paused) {
          lastTime = 0;
        }
      }

      function updateOverlay() {
        if (!running && !gameOver) {
          // idle / ready screen
          overlay.classList.remove('hidden');
        }
        if (running && paused) {
          overlayTitle.textContent = 'Paused';
          overlayText.textContent = 'Take a breath. Press Space to resume.';
          startBtn.textContent = 'Resume';
          overlay.classList.remove('hidden');
        } else if (running && !paused) {
          overlay.classList.add('hidden');
        }
      }

      function cycleSpeed() {
        const idx = SPEED_KEYS.indexOf(speedKey);
        speedKey = SPEED_KEYS[(idx + 1) % SPEED_KEYS.length];
        stepInterval = SPEEDS[speedKey].interval;
        speedBtn.textContent = 'Speed: ' + SPEEDS[speedKey].label;
      }

      // ---------- Keyboard ----------
      function setDirection(nx, ny) {
        // prevent reversal relative to current applied direction
        if (nx === -dir.x && ny === -dir.y) return;
        nextDir = { x: nx, y: ny };
      }

      function onKeyDown(e) {
        const k = e.key;
        const key = k.length === 1 ? k.toLowerCase() : k;

        // prevent page scroll for arrows/space
        if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)) {
          e.preventDefault();
        }

        if (key === 'arrowup' || key === 'w')    setDirection(0, -1);
        else if (key === 'arrowdown' || key === 's')  setDirection(0, 1);
        else if (key === 'arrowleft' || key === 'a')  setDirection(-1, 0);
        else if (key === 'arrowright' || key === 'd') setDirection(1, 0);
        else if (key === ' ') {
          if (!running && !gameOver) startGame();
          else togglePause();
        }
      }

      // ---------- Touch / swipe ----------
      let touchStart = null;
      canvas.addEventListener('touchstart', function (e) {
        const t = e.changedTouches[0];
        touchStart = { x: t.clientX, y: t.clientY };
      }, { passive: true });

      canvas.addEventListener('touchend', function (e) {
        if (!touchStart) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - touchStart.x;
        const dy = t.clientY - touchStart.y;
        const absX = Math.abs(dx), absY = Math.abs(dy);
        if (Math.max(absX, absY) > 24) {
          if (absX > absY) setDirection(dx > 0 ? 1 : -1, 0);
          else setDirection(0, dy > 0 ? 1 : -1);
        }
        touchStart = null;
      }, { passive: true });

      // ---------- Event wiring ----------
      startBtn.addEventListener('click', function () {
        if (running && paused) { togglePause(); }
        else { startGame(); }
      });

      pauseBtn.addEventListener('click', togglePause);

      restartBtn.addEventListener('click', function () {
        startGame();
      });

      speedBtn.addEventListener('click', cycleSpeed);

      window.addEventListener('keydown', onKeyDown);
      window.addEventListener('resize', resizeCanvas);

      // ---------- Init ----------
      function init() {
        try {
          const stored = localStorage.getItem('neonSnakeBest');
          if (stored) {
            best = parseInt(stored, 10) || 0;
            bestEl.textContent = String(best);
          }
        } catch (e) { /* storage may be blocked */ }

        speedBtn.textContent = 'Speed: ' + SPEEDS[speedKey].label;

        resizeCanvas();
        resetGame();

        // ready screen
        overlay.classList.remove('hidden');
        overlayTitle.textContent = 'Neon Snake';
        overlayText.textContent = 'Eat the glowing orbs, grow longer, and don\'t bite yourself. Use arrow keys or WASD.';
        startBtn.textContent = 'Play';

        draw();
      }

      init();
    })();
  </script>
</body>
</html>
