<style>

      function spikes(cx,cy,r,h,n,rot){for(var i=0;i<n;i++){var a=rot+i/n*Math.PI*2;ctx.beginPath();ctx.moveTo(cx+Math.cos(a-0.018)*r,cy+Math.sin(a-0.018)*r);ctx.lineTo(cx+Math.cos(a)*(r+h),cy+Math.sin(a)*(r+h));ctx.lineTo(cx+Math.cos(a+0.018)*r,cy+Math.sin(a+0.018)*r);ctx.stroke();}}

      function frame(now){var t=now-start,W=canvas.width,H=canvas.height,cx=W/2,cy=H/2;ctx.fillStyle='#0A0603';ctx.fillRect(0,0,W,H);var gg=ctx.createRadialGradient(cx,cy,0,cx,cy,H*0.62);gg.addColorStop(0,'rgba(130,78,16,0.4)');gg.addColorStop(1,'rgba(10,6,3,0)');ctx.fillStyle=gg;ctx.fillRect(0,0,W,H);var app=Math.min(1,t/400),rot=t*0.0005,base=Math.min(W,H)*0.15;ctx.lineWidth=1.15;var o1=ease(t/1300),o2=ease((t-220)/1300);ctx.strokeStyle='rgba(206,152,72,'+(0.95*app)+')';petals(cx,cy,base*0.42,base*(0.55+o1*1.75),12,rot,0.15);ctx.strokeStyle='rgba(224,186,110,'+(0.9*app)+')';petals(cx,cy,base*0.34,base*(0.46+o2*1.3),18,rot+Math.PI/18,0.10);if(t>420){ctx.strokeStyle='rgba(230,196,120,'+(0.9*app)+')';spikes(cx,cy,base*0.34,base*0.16,36,-rot*2.4);}if(t>560){ctx.strokeStyle='rgba(206,152,72,'+(0.8*app)+')';[0.34,0.55,0.85].forEach(function(k){ctx.beginPath();ctx.arc(cx,cy,base*k,0,Math.PI*2);ctx.stroke();});}if(t>720){ctx.strokeStyle='rgba(230,196,120,0.85)';spikes(cx,cy,base*0.14,base*0.14,24,rot*3);}if(t>300){ctx.strokeStyle='rgba(206,152,72,'+(0.5*app)+')';ctx.lineWidth=0.8;for(var s=0;s<28;s++){var a=rot+s/28*Math.PI*2;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*base*2.4,cy+Math.sin(a)*base*2.4);ctx.lineTo(cx+Math.cos(a)*Math.max(W,H),cy+Math.sin(a)*Math.max(W,H));ctx.stroke();}ctx.lineWidth=1.15;}if(t>1450){var fp=Math.min(1,(t-1450)/800),fr=Math.pow(fp,0.55);var fgr=ctx.createRadialGradient(cx,cy,0,cx,cy,H*0.98*fr);fgr.addColorStop(0,'rgba(250,244,232,'+fp+')');fgr.addColorStop(0.5,'rgba(245,238,224,'+(fp*0.9)+')');fgr.addColorStop(1,'rgba(222,212,190,0)');ctx.fillStyle=fgr;ctx.beginPath();ctx.arc(cx,cy,H*0.98*fr,0,Math.PI*2);ctx.fill();}if(t>2000){var sp=Math.min(1,(t-2000)/350);ctx.fillStyle='rgba(245,238,224,'+sp+')';ctx.fillRect(0,0,W,H);}if(t>2380&&!revealStarted)reveal();if(t<2420&&!introDone)requestAnimationFrame(frame);}
      requestAnimationFrame(frame);setTimeout(function(){if(!revealStarted)reveal();},2800);
    }
    function reveal(){if(revealStarted)return;revealStarted=true;startMain();var c=document.getElementById('introCanvas');if(c){c.style.transition='opacity 1100ms ease';c.style.opacity='0';setTimeout(function(){if(c.parentNode)c.parentNode.removeChild(c);},1150);}}
    function startMain(){if(introDone)return;introDone=true;animStarted=true;birthStart=performance.now();animate();document.querySelectorAll('.ui').forEach(function(el,i){setTimeout(function(){el.classList.add('visible');},500+i*70);});setStatus('idle');setTimeout(runDemo,1400);}

    function boot(){buildScene();seedChat();runIntro();}
    if(document.readyState==='loading')window.addEventListener('DOMContentLoaded',boot);else boot();
  })();
  </script>
